# Two targets:
#   snowflake (default): used when the project runs inside Snowflake as a dbt project object
#                        (EXECUTE DBT PROJECT). No credentials: dbt runs as the calling user and role.
#   local:               dbt CLI on a laptop, key-pair auth. Select it with DBT_TARGET=local.
mfg_multi_erp_spend:
  target: "{{ env_var('DBT_TARGET', 'snowflake') }}"
  outputs:
    snowflake:
      type: snowflake
      account: ""
      user: ""
      role: ACCOUNTADMIN
      warehouse: COMPUTE_WH
      database: MFG_SPEND_RISK
      schema: SILVER
      threads: 8
    local:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT', 'sfsenorthamerica-dfreriks_aws1_w2') }}"
      user: "{{ env_var('SNOWFLAKE_USER', 'dfreriks') }}"
      authenticator: snowflake_jwt
      private_key_path: "{{ env_var('SNOWFLAKE_PRIVATE_KEY_PATH', '/Users/dfreriks/.snowflake/keys/dfreriksdemo_rsa_key.p8') }}"
      role: ACCOUNTADMIN
      warehouse: COMPUTE_WH
      database: MFG_SPEND_RISK
      schema: SILVER
      threads: 8
