version: 2
models:
  - name: dim_supplier
    description: Golden supplier across every selected ERP.
    columns:
      - name: GOLDEN_SUPPLIER_ID
        data_tests: [unique, not_null]
  - name: fct_spend
    description: PO-line spend in USD with golden supplier, normalized category, contract and maverick flags.
    columns:
      - name: SPEND_USD
        data_tests: [not_null]
      - name: GOLDEN_SUPPLIER_ID
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_supplier')
                field: GOLDEN_SUPPLIER_ID
  - name: dim_supplier_risk
    columns:
      - name: GOLDEN_SUPPLIER_ID
        data_tests: [unique, not_null]
      - name: RISK_TIER
        data_tests:
          - accepted_values:
              arguments:
                values: ['Low', 'Medium', 'High', 'Critical']
  - name: mart_supplier_opportunity
    description: Category-level optimization levers on trailing-12-month spend (tail, maverick, price, risk).
    columns:
      - name: CATEGORY
        data_tests: [unique, not_null]
  - name: mart_supplier_issues
    description: Rule-based supplier issues with severity, dollar impact, standard remedy and evidence for Cortex.
    columns:
      - name: ISSUE_ID
        data_tests: [unique, not_null]
      - name: SEVERITY
        data_tests:
          - accepted_values:
              arguments:
                values: ['Critical', 'High', 'Medium']
